    author: "Marcus Tullius Cicero"
    title: "Epistulae ad Atticum"
    period: "68-43 BC"
    expected_letters: 431
    status: in_db_complete
    priority: 1
    rationale: "Core late Republican Roman correspondence already in DB but missing most modern translations and all geocoding."
