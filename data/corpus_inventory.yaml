version: 1
scope:
  start_year: -753
  end_year: 1453
  objective: "Letters by Roman writers from Rome's founding through 1453, translated to English, sourced, geolocated for sender and recipient, and supported by author/recipient bios where applicable."
  notes:
    - "This is a seed inventory, not a final bibliography."
    - "Current database coverage ends at AD 800; post-800 Roman Empire in the East targets require source-rights and scope review before text import."
    - "Documentary papyri require a separate inclusion policy because sender identity and Roman-writer status are often uncertain."

default_requirements: &default_requirements
  modern_english: required
  original_text: required
  source_url: required
  sender_recipient: required
  geolocation: required
  bios: required

targets:
